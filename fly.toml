# fly.toml app configuration file generated for convo-certo-app-muy1ga on 2026-02-11T14:46:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'convo-certo-app-muy1ga'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
